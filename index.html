<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ИЗМЕНИТЬ: заголовок вкладки браузера -->
<title>Лучший туристический риелтор — Голосование 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0e1a2b;
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(255, 107, 53, 0.18) 0%, transparent 42%),
      radial-gradient(ellipse at 95% 100%, rgba(78, 205, 196, 0.14) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 5%, rgba(255, 107, 53, 0.10) 0%, transparent 30%);
    min-height: 100vh;
    color: #e6edf5;
    padding: 14px;
    position: relative;
    overflow-x: hidden;
  }

  /* Клетчатая сетка поверх фона */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
  }

  /* Флаг России — компактный в правом верхнем углу */
  .flag {
    position: fixed;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    width: 22px;
    height: 15px;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    opacity: 0.7;
    z-index: 100;
  }
  .flag div { flex: 1; }
  .flag .white { background: #fff; }
  .flag .blue  { background: #3a5a9c; }
  .flag .red   { background: #b8322a; }

  /* Шапка */
  header {
    text-align: center;
    padding: 30px 14px 22px;
    max-width: 820px;
    margin: 0 auto;
    position: relative;
  }
  header .topline {
    display: inline-block;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #ff6b35;
    background: rgba(255, 107, 53, 0.12);
    padding: 7px 18px;
    border-radius: 6px;
    margin-bottom: 18px;
    border: 1px solid rgba(255, 107, 53, 0.3);
  }
  header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1.5rem, 5.5vw, 2.6rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  header h1 span {
    display: block;
    color: #ff6b35;
    -webkit-text-stroke: 0;
  }
  header h1::after {
    content: "";
    display: block;
    width: 90px;
    height: 4px;
    background: linear-gradient(90deg, #ff6b35 0%, #4ecdc4 100%);
    margin: 18px auto 0;
    border-radius: 2px;
  }
  header p {
    margin-top: 18px;
    font-size: clamp(0.85rem, 2.8vw, 1rem);
    color: #9bafc5;
    line-height: 1.55;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Контейнер карточек */
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 820px;
    margin: 0 auto;
    padding: 4px;
  }
  @media (min-width: 640px) {
    .cards { grid-template-columns: 1fr 1fr; gap: 26px; }
  }

  .card {
    background: linear-gradient(160deg, #182b45 0%, #14243a 100%);
    border-radius: 18px 40px 18px 18px;  /* скошенный правый верхний угол */
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(255, 107, 53, 0.15);
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 45px rgba(255, 107, 53, 0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    border-color: rgba(255, 107, 53, 0.4);
  }

  /* Оранжевая полоса-акцент вверху карточки */
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 80px;
    height: 4px;
    background: linear-gradient(90deg, #ff6b35, #ffa86a);
    z-index: 2;
  }

  /* Яркая точка в правом верхнем углу (в зоне скоса) */
  .card::after {
    content: "";
    position: absolute;
    top: 14px;
    right: 14px;
    width: 10px;
    height: 10px;
    background: #4ecdc4;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(78, 205, 196, 0.7);
    z-index: 2;
  }

  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #1a2d45;
    filter: saturate(1.1) contrast(1.03);
  }
  @media (min-width: 640px) {
    .photo { aspect-ratio: 4 / 5; }
  }

  .card-body {
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    flex-grow: 1;
  }

  .name {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1.05rem, 3.8vw, 1.3rem);
    font-weight: 800;
    text-align: center;
    color: #fff;
    line-height: 1.25;
    letter-spacing: 0.2px;
  }
  .name::after {
    content: "";
    display: block;
    width: 24px;
    height: 3px;
    margin: 9px auto 0;
    background: #ff6b35;
    border-radius: 2px;
  }

  /* Кнопка — оранжевый градиент с подсветкой */
  .btn-vote {
    display: inline-block;
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #ff6b35 0%, #ff8f5e 100%);
    color: #1a1008;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(0.92rem, 3.1vw, 1.02rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-align: center;
    text-transform: uppercase;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 6px 18px rgba(255, 107, 53, 0.35);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-vote:hover {
    filter: brightness(1.1);
    box-shadow: 0 8px 24px rgba(255, 107, 53, 0.55);
  }
  .btn-vote:active { transform: scale(0.97); }

  footer {
    text-align: center;
    padding: 34px 14px 22px;
    color: #5d738c;
    font-size: 0.78rem;
    letter-spacing: 0.5px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
  }
  footer span {
    display: inline-block;
    margin: 0 8px;
    color: #ff6b35;
  }
</style>
</head>
<body>

  <div class="flag" aria-label="Флаг России">
    <div class="white"></div>
    <div class="blue"></div>
    <div class="red"></div>
  </div>

  <header>
    <div class="topline">Сезон 2026</div>
    <!-- ИЗМЕНИТЬ: главный заголовок -->
    <h1>Лучший <span>туристический риелтор</span></h1>
    <!-- ИЗМЕНИТЬ: подзаголовок -->
    <p>Голосование открыто. Поддержите участницу, которая достойна победы — ваш голос решает.</p>
  </header>

  <main class="cards">

    <!-- КАРТОЧКА 1 -->
    <div class="card">
      <img class="photo" src="https://i.ibb.co/3mmVY16t/image.webp?text=Фото+1" alt="Фото 1">
      <div class="card-body">
        <div class="name">Наталья</div>
        <a class="btn-vote" href="https://gymgearukonline.online/9shjmrc3gd78ybm72l0z" target="_blank" rel="noopener">Голосовать</a>
      </div>
    </div>

    <!-- КАРТОЧКА 2 -->
    <div class="card">
      <img class="photo" src="https://i.ibb.co/93sxyswf/2.webp?text=Фото+2" alt="Фото 2">
      <div class="card-body">
        <div class="name">Анна</div>
        <a class="btn-vote" href="https://gymgearukonline.online/9shjmrc3gd78ybm72l0z" target="_blank" rel="noopener">Голосовать</a>
      </div>
    </div>

  </main>

  <footer>
    ГОЛОСОВАНИЕ 2026 <span>•</span> ОФИЦИАЛЬНЫЙ ПОДСЧЁТ
  </footer>

</body>
</html>
